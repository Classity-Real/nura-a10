name: Build kernel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap and deps
        run: |
          apk add --no-cache pmbootstrap git openssl sudo shadow bash

      - name: Pre-stage pmaports with our device + kernel packages
        run: |
          # Clone pmaports ourselves first, into the path pmbootstrap expects,
          # and drop our device package in BEFORE running init. This way the
          # init wizard's device prompt finds "a10" immediately instead of
          # offering to scaffold a brand new device port.
          mkdir -p /root/.local/var/pmbootstrap/cache_git
          git clone --depth 1 --branch main https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            /root/.local/var/pmbootstrap/cache_git/pmaports \
            || git clone --depth 1 https://gitlab.com/postmarketOS/pmaports.git \
               /root/.local/var/pmbootstrap/cache_git/pmaports

          cp -r "$GITHUB_WORKSPACE"/device/testing/device-samsung-a10 \
            /root/.local/var/pmbootstrap/cache_git/pmaports/device/testing/
          cp -r "$GITHUB_WORKSPACE"/device/testing/linux-samsung-a10 \
            /root/.local/var/pmbootstrap/cache_git/pmaports/device/testing/

      - name: Run pmbootstrap init with pre-staged device
        shell: bash
        run: |
          # Built as a bash array, one element per prompt in exact order,
          # captured from a real local `pmbootstrap --as-root init` run
          # with device-samsung-a10 already present (so it shows up
          # directly, no "new device port" sub-wizard triggers).
          # "" = accept whatever default pmbootstrap shows for that prompt.
          answers=(
            ""          # 1.  Work path
            ""          # 2.  pmaports path
            ""          # 3.  Channel [edge]
            "samsung"   # 4.  Vendor
            "a10"       # 5.  Device codename
            ""          # 6.  Username [user]
            ""          # 7.  Audio backend provider
            ""          # 8.  WiFi backend provider
            ""          # 9.  usb-moded profile provider
            ""          # 10. User interface [console]
            ""          # 11. Service manager [openrc]
            ""          # 12. Change additional options? (y/n) [n]
            ""          # 13. Extra packages [none]
            ""          # 14. Locale [en_US]
            ""          # 15. Device hostname [samsung-a10]
            ""          # 16. Build outdated packages? (y/n) [y]
            ""          # 17. Zap existing chroots? (y/n) [y]
          )
          printf '%s\n' "${answers[@]}" > /tmp/init-answers.txt
          echo "Prepared $(wc -l < /tmp/init-answers.txt) answer lines:"
          cat -A /tmp/init-answers.txt
          pmbootstrap --as-root init < /tmp/init-answers.txt

      - name: Verify config landed correctly
        run: |
          pmbootstrap --as-root config

      - name: Build kernel
        run: |
          pmbootstrap --as-root build linux-samsung-a10

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find /root/.local/var/pmbootstrap/packages -name 'linux-samsung-a10-*.apk' -exec cp {} artifacts/ \; || true
          cp /root/.local/var/pmbootstrap/log.txt artifacts/pmbootstrap-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-samsung-a10-build
          path: artifacts/
